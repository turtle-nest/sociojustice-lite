spring:
  application:
    name: sociojustice-lite-api
  datasource:
    url: jdbc:postgresql://localhost:5432/sociojustice
    username: sj
    password: sj
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true

server:
  port: 3000

jwt:
  secret: "dev-only-change-this-please-32b-min"
  expires-in-seconds: 86400
