<div class="min-h-screen flex items-center justify-center bg-gray-950 px-4">
  <div class="w-full max-w-md bg-gray-900 border border-gray-700 rounded-2xl p-8 shadow-lg">
    <h1 class="text-2xl font-bold text-white mb-6">Connexion</h1>
    
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <!-- Email -->
      <div>
        <label for="email" class="block text-gray-300 mb-1">Adresse e-mail</label>
        <input
          id="email"
          type="email"
          placeholder="prenom.nom@email.com"
          formControlName="email"
          class="w-full px-3 py-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <p class="text-red-400 text-sm mt-1" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Adresse e-mail invalide
        </p>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-gray-300 mb-1">Mot de passe</label>
        <div class="flex gap-2">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="••••••••"
            formControlName="password"
            class="flex-1 px-3 py-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
          <button type="button" (click)="togglePassword()" 
                  class="px-3 py-2 text-sm border border-gray-600 rounded-lg text-gray-300 hover:bg-gray-700">
            {{ showPassword ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
        <p class="text-red-400 text-sm mt-1" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Mot de passe requis (min. 8 caractères)
        </p>
      </div>

      <!-- Error serveur -->
      <p *ngIf="serverError" class="text-red-500 text-sm">{{ serverError }}</p>

      <!-- Submit -->
      <button type="submit" [disabled]="isSubmitting"
              class="w-full py-2 rounded-lg font-bold bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-70">
        {{ isSubmitting ? 'Connexion…' : 'Se connecter' }}
      </button>
    </form>

    <p class="text-gray-400 text-sm mt-4">
      Pas de compte ? <a routerLink="/auth/register" class="text-indigo-400 hover:underline">Créer un compte</a>
    </p>
  </div>
</div>
